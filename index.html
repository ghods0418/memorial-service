<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추모 예배</title>

    <!-- Google Fonts: Noto Sans KR (고딕체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS for layout and utilities -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom Styles matching the requested design */
        :root {
            --bg-color: #FDFBF7;
            /* 조금 더 밝고 화사한 베이지 */
            --text-color: #3E2723;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1.25rem;
            /* 20px - 어르신들이 읽기 편하도록 크기 확대 */
            line-height: 1.65;
            /* 넉넉한 줄간격 */
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Page transition animation */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bottom Navigation styling constraints */
        .bottom-nav {
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(5px);
        }

        /* Paragraph spacing */
        .content-body p {
            margin-bottom: 1rem;
            word-break: keep-all;
            /* 단어 단위로 줄바꿈되어 읽기 편함 */
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

    <!-- Main Container: Centered, max width 600px for mobile/desktop harmony -->
    <div class="w-full max-w-[600px] mx-auto relative flex flex-col flex-grow shadow-sm min-h-screen"
        style="background-color: var(--bg-color);">

        <!-- Content Area -->
        <main id="contentArea" class="flex-grow flex flex-col justify-center px-5 pt-10 pb-28">
            <!-- Pages will be dynamically injected here by JavaScript -->
        </main>

        <!-- Fixed Bottom Navigation -->
        <nav class="bottom-nav fixed bottom-0 left-0 w-full border-t border-[#dcd7cc] z-50">
            <div class="max-w-[600px] mx-auto w-full flex justify-between items-center p-4 px-5">
                <button id="prevBtn" onclick="prevPage()"
                    class="w-[48%] py-3.5 border border-[#3E2723] text-[#3E2723] rounded-lg font-bold text-lg active:bg-[#e6e2d8] transition-colors focus:outline-none">
                    이전 순서
                </button>
                <button id="nextBtn" onclick="nextPage()"
                    class="w-[48%] py-3.5 bg-[#3E2723] text-[#F4F1EA] rounded-lg font-bold text-lg active:bg-[#2b1a17] transition-colors focus:outline-none ml-auto">
                    다음 순서
                </button>
            </div>
        </nav>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Array of pages with content
        const pages = [
            // Page 1: Title
            `<div class="text-center w-full">
                <h2 class="text-2xl font-bold mb-4 leading-normal">고사동 집사님<br>추모 예배</h2>
                <p class="text-sm mt-6 opacity-80">화면 하단의 '다음 순서'를 눌러주세요.</p>
            </div>`,

            // Page 2: Apostles' Creed
            `<div class="w-full content-body">
                <h3 class="text-xl font-bold mb-8 text-center border-b border-[#3E2723] pb-4">Ⅱ. 사도신경</h3>
                <p>나는 전능하신 아버지 하나님, 천지의 창조주를 믿습니다.<br>
                나는 그의 유일하신 아들, 우리 주 예수 그리스도를 믿습니다.<br>
                그는 성령으로 잉태되어 동정녀 마리아에게서 나시고,<br>
                본디오 빌라도에게 고난을 받아 십자가에 못 박혀 죽으시고,<br>
                장사된 지 사흘만에 죽은 자 가운데서 다시 살아나셨으며,<br>
                하늘에 오르시어 전능하신 아버지 하나님 우편에 앉아 계시다가,<br>
                거기로부터 살아 있는 자와 죽은 자를 심판하러 오십니다.</p>
                <p>나는 성령을 믿으며, 거룩한 공교회와 성도의 교제와 죄를 용서받는 것과<br>
                몸의 부활과 영생을 믿습니다. 아멘.</p>
            </div>`,

            // Page 3: Opening Prayer
            `<div class="w-full content-body">
                <h3 class="text-xl font-bold mb-8 text-center border-b border-[#3E2723] pb-4">Ⅲ. 여는 기도</h3>
                <p>하나님 아버지 오늘 저희 가족이 모여 고사동 집사님의 열여덟해 기일로 추모 예배를 드립니다. 긍휼히 여기사 하늘의 위로와 평강으로 채워주옵소서. 이자리 참석하지 못한 가족들 각자의 형편을 살펴주옵소서.</p>
                <p>고사동 집사님을 먼저 하나님 품으로 부르시고, 남은 저희들을 지금까지 지켜주신 은혜에 감사합니다. 이 시간 저희의 마음을 모아 예배하오니 고사동 집사님을 기억하는 의미있는 시간이 되게 하여 주시옵소서. 예수님의 이름으로 기도드립니다. 아멘.</p>
            </div>`,

            // Page 4: Scripture Reading
            `<div class="w-full content-body text-left">
                <h3 class="text-xl font-bold mb-8 text-center border-b border-[#3E2723] pb-4">Ⅳ. 성경 봉독</h3>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">1. 전도서 3:1-2</p>
                    <p class="pl-4">1 범사에 기한이 있고 천하 만사가 다 때가 있나니<br>
                    2 날 때가 있고 죽을 때가 있으며 심을 때가 있고 심은 것을 뽑을 때가 있으며</p>
                </div>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">2. 시편 103:15-17</p>
                    <p class="pl-4">15 인생은 그 날이 풀과 같으며 그 영화가 들의 꽃과 같도다<br>
                    16 그것은 바람이 지나가면 없어지나니 그 있던 자리도 다시 알지 못하거니와<br>
                    17 여호와의 인자하심은 자기를 경외하는 자에게 영원부터 영원까지 이르며 그의 의는 자손의 자손에게 이르리니</p>
                </div>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">3. 시편 90:12~17</p>
                    <p class="pl-4">12 우리에게 우리 날 계수함을 가르치사 지혜로운 마음을 얻게 하소서<br>
                    13 여호와여 돌아오소서 언제까지니이까 주의 종들을 불쌍히 여기소서<br>
                    14 아침에 주의 인자하심이 우리를 만족하게 하사 우리를 일생 동안 즐겁고 기쁘게 하소서<br>
                    15 우리를 괴롭게 하신 날수대로와 우리가 화를 당한 연수대로 우리를 기쁘게 하소서<br>
                    16 주께서 행하신 일을 주의 종들에게 나타내시며 주의 영광을 그들의 자손에게 나타내소서<br>
                    17 주 우리 하나님의 은총을 우리에게 내리게 하사 우리의 손이 행한 일을 우리에게 견고하게 하소서 우리의 손이 행한 일을 견고하게 하소서</p>
                </div>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">4. 요한계시록 21:3~4</p>
                    <p class="pl-4">3 내가 들으니 보좌에서 큰 음성이 나서 이르되 보라 하나님의 장막이 사람들과 함께 있으매 하나님이 그들과 함께 계시리니 그들은 하나님의 백성이 되고 하나님은 친히 그들과 함께 계셔서<br>
                    4 모든 눈물을 그 눈에서 닦아 주시니 다시는 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라</p>
                </div>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">5. 에베소서 6:1~3</p>
                    <p class="pl-4">1 자녀들아 주 안에서 너희 부모에게 순종하라 이것이 옳으니라<br>
                    2 네 아버지와 어머니를 공경하라 이것은 약속이 있는 첫 계명이니<br>
                    3 이로써 네가 잘되고 땅에서 장수하리라</p>
                </div>
                
                <div class="mb-6">
                    <p class="font-bold mb-2">6. 신명기 31:7~8</p>
                    <p class="pl-4">7 ... 너는 강하고 담대하라 너는 이 백성을 거느리고 여호와께서 그들의 조상에게 주리라고 맹세하신 땅에 들어가서 그들에게 그 땅을 차지하게 하라<br>
                    8 그리하면 여호와 그가 네 앞에서 가시며 너와 함께 하사 너를 떠나지 아니하시며 버리지 아니하시리니 너는 두려워하지 말라 놀라지 말라</p>
                </div>
            </div>`,

            // Page 5: Closing Prayer
            `<div class="w-full content-body">
                <h3 class="text-xl font-bold mb-8 text-center border-b border-[#3E2723] pb-4">Ⅴ. 마치는 기도</h3>
                <p>자비로우신 하나님, 이 시간 고사동 집사님을 생각하며 예배하게 하시니 감사합니다.</p>
                <p>고사동 집사님의 헌신과 사랑을 각자의 가슴에 새기고, 우리가족 서로 사랑하며 화목하게 살아가게 하옵소서.</p>
                <p>우리의 앞길을 선하게 인도하시고, 건강과 지혜의 축복이 충만하길 간절히 기도드립니다.<br>예수님의 이름으로 기도드립니다. 아멘.</p>
            </div>`,

            // Page 6: The Lord's Prayer
            `<div class="w-full content-body">
                <h3 class="text-xl font-bold mb-8 text-center border-b border-[#3E2723] pb-4">Ⅵ. 주기도문</h3>
                <p>하늘에 계신 우리 아버지, 아버지의 이름을 거룩하게 하시며 아버지의 나라가 오게 하시며, 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지게 하소서.</p>
                <p>오늘 우리에게 일용할 양식을 주시고, 우리가 우리에게 잘못한 사람을 용서하여 준 것 같이 우리 죄를 용서하여 주시고, 우리를 시험에 빠지지 않게 하시고 악에서 구하소서. 나라와 권능과 영광이 영원히 아버지의 것입니다. 아멘.</p>
            </div>`,

            // Page 7: End
            `<div class="text-center w-full">
                <h2 class="text-2xl font-bold mb-4">Ⅶ. 예배를 마칩니다.</h2>
                <p class="mt-4">수고하셨습니다.</p>
            </div>`
        ];

        let currentPageIndex = 0;
        const contentArea = document.getElementById('contentArea');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function updateNavigation() {
            // Manage Previous Button Visibility
            if (currentPageIndex === 0) {
                prevBtn.style.visibility = 'hidden';
            } else {
                prevBtn.style.visibility = 'visible';
            }

            // Manage Next Button Visibility & Layout
            if (currentPageIndex === pages.length - 1) {
                nextBtn.style.display = 'none';
                prevBtn.classList.remove('w-[48%]');
                prevBtn.classList.add('w-full'); // Make Previous button full width on last page
            } else {
                nextBtn.style.display = 'block';
                prevBtn.classList.remove('w-full');
                prevBtn.classList.add('w-[48%]');
            }
        }

        function renderPage() {
            // Remove animation class to restart it
            contentArea.classList.remove('fade-in');

            // Trigger reflow to restart CSS animation
            void contentArea.offsetWidth;

            // Inject content and add animation class
            contentArea.innerHTML = pages[currentPageIndex];
            contentArea.classList.add('fade-in');

            // Scroll to top of the document for longer pages
            window.scrollTo({ top: 0, behavior: 'smooth' });

            updateNavigation();
        }

        function nextPage() {
            if (currentPageIndex < pages.length - 1) {
                currentPageIndex++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderPage();
            }
        }

        // Initialize the first page on load
        window.onload = () => {
            renderPage();
        };
    </script>
</body>

</html>
